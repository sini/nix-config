apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: genie-guard
  namespace: genie
spec:
  duration: 24h
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: xmsg-cluster-ca
  privateKey:
    algorithm: ECDSA
    encoding: PKCS8
    rotationPolicy: Always
    size: 256
  renewBefore: 8h
  secretName: genie-guard-xmsg-tls
  uris:
    - spiffe://json64.dev/ns/genie/sa/genie-guard
  usages:
    - digital signature
    - key encipherment
    - server auth
    - client auth
