apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: genie-guard
    app.kubernetes.io/name: xmsg
  name: genie-guard
  namespace: genie
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: genie-guard
      app.kubernetes.io/name: xmsg
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        checksum/peers: 7f8d5639b38f954805bb15077f904d9d793f9080b366002255ec4c771df7f849
      labels:
        app.kubernetes.io/instance: genie-guard
        app.kubernetes.io/name: xmsg
    spec:
      automountServiceAccountToken: false
      containers:
        - args:
            - serve
            - --leaf
            - --leaf-principal
            - genie-guard
            - --listen
            - 127.0.0.1:7787
            - --leaf-register-sock
            - /run/xmsg/register.sock
            - --agent-sock
            - /run/xmsg/agent.sock
            - --db-path
            - /var/lib/xmsg/db/xmsg.db
            - --peers-file
            - /etc/xmsg/peers/peers.json
            - --fed-cert
            - /etc/xmsg/tls/tls.crt
            - --fed-key
            - /etc/xmsg/tls/tls.key
          env:
            - name: XDG_RUNTIME_DIR
              value: /run
          image: ghcr.io/sini/xmsg@sha256:52a4710643a10c1e922dcf7c32d467222f79be444589e0bf1c0c0a869fab7a37
          imagePullPolicy: IfNotPresent
          name: xmsg
          resources: {}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 65532
            runAsNonRoot: true
            runAsUser: 65532
          volumeMounts:
            - mountPath: /run
              name: runtime
            - mountPath: /var/lib/xmsg
              name: state
            - mountPath: /etc/xmsg/tls
              name: tls
              readOnly: true
            - mountPath: /etc/xmsg/peers
              name: peers
              readOnly: true
        - env:
            - name: GENIE_GUARD_NINFER_URL
              valueFrom:
                secretKeyRef:
                  key: ninfer-url
                  name: genie-guard
            - name: GENIE_GUARD_API_KEY_FILE
              value: /etc/genie-guard/api-key
            - name: XDG_RUNTIME_DIR
              value: /run
          image: ghcr.io/sini/genie-guard@sha256:ead3fbd648b3b67c58853d567d976bbe68af6df5309732d518b2ebae5972c9ce
          name: genie-guard
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 65532
            runAsNonRoot: true
            runAsUser: 65532
          volumeMounts:
            - mountPath: /tmp
              name: tmp
            - mountPath: /etc/genie-guard
              name: api-key
              readOnly: true
            - mountPath: /run
              name: runtime
      enableServiceLinks: false
      initContainers:
        - command:
            - mkdir
            - -m
            - "0700"
            - -p
            - /var/lib/xmsg/db
          image: library/busybox@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
          name: prepare-state
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 65532
            runAsNonRoot: true
            runAsUser: 65532
          volumeMounts:
            - mountPath: /var/lib/xmsg
              name: state
      securityContext:
        fsGroup: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: genie-guard
      volumes:
        - emptyDir:
            medium: Memory
          name: runtime
        - emptyDir: {}
          name: state
        - name: tls
          secret:
            defaultMode: 288
            secretName: genie-guard-xmsg-tls
        - configMap:
            name: genie-guard-peers
          name: peers
        - emptyDir: {}
          name: tmp
        - name: api-key
          secret:
            defaultMode: 288
            items:
              - key: api-key
                path: api-key
            secretName: genie-guard
