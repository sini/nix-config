apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-synapse-admins-egress
  namespace: matrix
spec:
  description: Allow the synapse-admins job Synapse, nothing else (DNS is cluster-wide).
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: synapse
      toPorts:
        - ports:
            - port: "8008"
              protocol: TCP
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: synapse-admins
