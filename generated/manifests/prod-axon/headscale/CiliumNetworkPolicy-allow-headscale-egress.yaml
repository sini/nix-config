apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-headscale-egress
  namespace: headscale
spec:
  description: 'headscale: public HTTPS (the DERP map).'
  egress:
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: headscale
