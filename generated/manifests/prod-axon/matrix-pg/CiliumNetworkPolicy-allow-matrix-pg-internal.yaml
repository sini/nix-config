apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-matrix-pg-internal
  namespace: matrix
spec:
  description: "matrix-pg ingress: synapse (5432), peer replication (5432/8000), CNPG operator (8000), prometheus (9187)."
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: matrix-pg
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: synapse
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            cnpg.io/cluster: matrix-pg
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
            - port: "8000"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cnpg-system
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: prometheus
            k8s:io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "9187"
              protocol: TCP
