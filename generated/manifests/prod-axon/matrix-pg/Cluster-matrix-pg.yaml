apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: matrix-pg
  namespace: matrix
spec:
  affinity:
    podAntiAffinityType: required
  backup:
    volumeSnapshot:
      className: longhorn-backup-nfs
  bootstrap:
    initdb:
      database: synapse
      encoding: UTF8
      localeCType: C
      localeCollate: C
      owner: synapse
      secret:
        name: matrix-pg-synapse-password
  inheritedMetadata:
    labels:
      recurring-job-group.longhorn.io/db-local-snap: enabled
  instances: 2
  storage:
    size: 10Gi
    storageClass: longhorn-single
