apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    app: kube-prometheus-stack
    app.kubernetes.io/instance: kube-prometheus-stack
    app.kubernetes.io/part-of: kube-prometheus-stack
    chart: kube-prometheus-stack-93.1.0
    heritage: Helm
    release: kube-prometheus-stack
  name: kube-prometheus-stack-hosts
  namespace: monitoring
spec:
  groups:
    - name: hosts
      rules:
        - alert: HostSilent
          annotations:
            summary: bitstream has sent no node metrics for 10m
          expr: absent_over_time(up{job="node-exporter", instance="bitstream"}[5m]) or max_over_time(up{job="node-exporter", instance="bitstream"}[5m]) < 1
          for: 5m
          labels:
            instance: bitstream
            severity: critical
        - alert: HostSilent
          annotations:
            summary: cortex has sent no node metrics for 10m
          expr: absent_over_time(up{job="node-exporter", instance="cortex"}[5m]) or max_over_time(up{job="node-exporter", instance="cortex"}[5m]) < 1
          for: 5m
          labels:
            instance: cortex
            severity: critical
        - alert: HostSilent
          annotations:
            summary: cortex-cuda has sent no node metrics for 10m
          expr: absent_over_time(up{job="node-exporter", instance="cortex-cuda"}[5m]) or max_over_time(up{job="node-exporter", instance="cortex-cuda"}[5m]) < 1
          for: 5m
          labels:
            instance: cortex-cuda
            severity: critical
        - alert: HostSilent
          annotations:
            summary: axon-01 has sent no node metrics for 10m
          expr: absent_over_time(up{job="node-exporter", instance="axon-01"}[5m]) or max_over_time(up{job="node-exporter", instance="axon-01"}[5m]) < 1
          for: 5m
          labels:
            instance: axon-01
            severity: critical
        - alert: HostSilent
          annotations:
            summary: axon-02 has sent no node metrics for 10m
          expr: absent_over_time(up{job="node-exporter", instance="axon-02"}[5m]) or max_over_time(up{job="node-exporter", instance="axon-02"}[5m]) < 1
          for: 5m
          labels:
            instance: axon-02
            severity: critical
        - alert: HostSilent
          annotations:
            summary: axon-03 has sent no node metrics for 10m
          expr: absent_over_time(up{job="node-exporter", instance="axon-03"}[5m]) or max_over_time(up{job="node-exporter", instance="axon-03"}[5m]) < 1
          for: 5m
          labels:
            instance: axon-03
            severity: critical
        - alert: HostSilent
          annotations:
            summary: uplink has sent no node metrics for 10m
          expr: absent_over_time(up{job="node-exporter", instance="uplink"}[5m]) or max_over_time(up{job="node-exporter", instance="uplink"}[5m]) < 1
          for: 5m
          labels:
            instance: uplink
            severity: critical
        - alert: HostSilent
          annotations:
            summary: uplink-dev has sent no node metrics for 10m
          expr: absent_over_time(up{job="node-exporter", instance="uplink-dev"}[5m]) or max_over_time(up{job="node-exporter", instance="uplink-dev"}[5m]) < 1
          for: 5m
          labels:
            instance: uplink-dev
            severity: critical
        - alert: IngestDown
          annotations:
            summary: 'No host has pushed node metrics for 10m: the ingest path is down'
          expr: absent_over_time(up{job="node-exporter"}[5m])
          for: 5m
          labels:
            severity: critical
        - alert: NodeMemoryMajorPagesFaults
          annotations:
            description: '{{ $labels.instance }} has had a very high rate of major page faults for 15 minutes, now {{ printf "%.0f" $value }}/s (20000/s on dev and nix-builder hosts, 500/s elsewhere). Check NodeMemoryPressure: faults without memory stall are page-ins, not a shortage.'
            runbook_url: https://runbooks.prometheus-operator.dev/runbooks/node/nodememorymajorpagesfaults
            summary: Memory major page faults are occurring at very high rate.
          expr: |
            (
              rate(node_vmstat_pgmajfault{job="node-exporter"}[5m]) > 20000
              and on (instance) host_role{role=~"dev|nix-builder"}
            )
            or
            (
              rate(node_vmstat_pgmajfault{job="node-exporter"}[5m]) > 500
              unless on (instance) host_role{role=~"dev|nix-builder"}
            )
          for: 15m
          labels:
            severity: warning
        - alert: NodeCPUHighUsage
          annotations:
            description: '{{ $labels.instance }} has used over 90% of its CPU for 15 minutes (an hour on dev and nix-builder hosts, where builds saturate it), now {{ printf "%.0f" $value }}%.'
            runbook_url: https://runbooks.prometheus-operator.dev/runbooks/node/nodecpuhighusage
            summary: High CPU usage.
          expr: |
            (
              min_over_time((sum without (mode) (avg without (cpu) (rate(node_cpu_seconds_total{job="node-exporter", mode!~"idle|iowait"}[2m]))) * 100)[45m:1m]) > 90
              and on (instance) host_role{role=~"dev|nix-builder"}
            )
            or
            (
              sum without (mode) (avg without (cpu) (rate(node_cpu_seconds_total{job="node-exporter", mode!~"idle|iowait"}[2m]))) * 100 > 90
              unless on (instance) host_role{role=~"dev|nix-builder"}
            )
          for: 15m
          labels:
            severity: info
        - alert: NodeMemoryPressure
          annotations:
            description: '{{ $labels.instance }} has had every runnable task stalled on memory for {{ $value | humanizePercentage }} of the time for 15 minutes. Check its largest processes and swap use.'
            summary: Memory pressure is stalling work.
          expr: rate(node_pressure_memory_stalled_seconds_total{job="node-exporter"}[5m]) > 0.05
          for: 15m
          labels:
            severity: warning
