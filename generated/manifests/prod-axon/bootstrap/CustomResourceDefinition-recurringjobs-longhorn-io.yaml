apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  labels:
    app.kubernetes.io/instance: longhorn
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: longhorn
    app.kubernetes.io/version: v1.13.0
    helm.sh/chart: longhorn-1.13.0
    longhorn-manager: ""
  name: recurringjobs.longhorn.io
spec:
  group: longhorn.io
  names:
    kind: RecurringJob
    listKind: RecurringJobList
    plural: recurringjobs
    shortNames:
      - lhrj
    singular: recurringjob
  scope: Namespaced
  versions:
    - additionalPrinterColumns:
        - description: Sets groupings to the jobs. When set to "default" group will be added to the volume label when no other job label exist in volume
          jsonPath: .spec.groups
          name: Groups
          type: string
        - description: Should be one of "snapshot", "snapshot-force-create", "snapshot-cleanup", "snapshot-delete", "backup", "backup-force-create", "filesystem-trim" or "system-backup"
          jsonPath: .spec.task
          name: Task
          type: string
        - description: The cron expression represents recurring job scheduling
          jsonPath: .spec.cron
          name: Cron
          type: string
        - description: Whether snapshots/backups are retained based on count ("count-based") or age ("age-based")
          jsonPath: .spec.retentionPolicy
          name: RetentionPolicy
          type: string
        - description: The number of snapshots/backups to keep for the volume
          jsonPath: .spec.retain
          name: RetainCount
          type: integer
        - description: Snapshots/backups older than this duration are cleaned up when the retention policy is "age-based"
          jsonPath: .spec.retainAge
          name: RetainAge
          type: string
        - description: The concurrent job to run by each cron job
          jsonPath: .spec.concurrency
          name: Concurrency
          type: integer
        - jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
        - description: Specify the labels
          jsonPath: .spec.labels
          name: Labels
          type: string
      name: v1beta2
      schema:
        openAPIV3Schema:
          description: RecurringJob is where Longhorn stores recurring job object.
          properties:
            apiVersion:
              description: |-
                APIVersion defines the versioned schema of this representation of an object.
                Servers should convert recognized schemas to the latest internal value, and
                may reject unrecognized values.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
              type: string
            kind:
              description: |-
                Kind is a string value representing the REST resource this object represents.
                Servers may infer this from the endpoint the client submits requests to.
                Cannot be updated.
                In CamelCase.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
              type: string
            metadata:
              type: object
            spec:
              description: RecurringJobSpec defines the desired state of the Longhorn recurring job
              properties:
                concurrency:
                  description: The concurrency of taking the snapshot/backup.
                  type: integer
                cron:
                  description: The cron setting.
                  type: string
                groups:
                  description: The recurring job group.
                  items:
                    type: string
                  type: array
                labels:
                  additionalProperties:
                    type: string
                  description: The label of the snapshot/backup.
                  type: object
                name:
                  description: The recurring job name.
                  type: string
                parameters:
                  additionalProperties:
                    type: string
                  description: |-
                    The parameters of the snapshot/backup.
                    Support parameters: "full-backup-interval", "volume-backup-policy".
                  type: object
                retain:
                  description: |-
                    The retain count of the snapshot/backup.
                    Retain represents the number of snapshots/backups to retain and only when the retention policy is "count-based".
                  type: integer
                retainAge:
                  description: |-
                    The retention age of the snapshot/backup, specified as a Go duration string,
                    such as "10m", "24h", or "8760h". Note that Go durations have no day or year unit,
                    so a day is "24h". Snapshots/backups older than this are cleaned up by the recurring job.
                    Only takes effect when the retention policy is "age-based".
                    If the retention policy is "age-based", this value is 0s, the recurring job will not start.
                  type: string
                  x-kubernetes-validations:
                    - message: retainAge must be a positive duration
                      rule: '!self.startsWith(''-'')'
                retentionPolicy:
                  default: count-based
                  description: |-
                    The retention policy that determines whether the recurring job cleans up
                    snapshots/backups based on their count or age. Can be "count-based" or
                    "age-based". The two policies work independently: "count-based" (the default)
                    retains the configured number of newest snapshots/backups and ignores
                    RetainAge, while "age-based" retains snapshots/backups no older than RetainAge
                    and ignores Retain.
                  enum:
                    - count-based
                    - age-based
                  type: string
                task:
                  description: |-
                    The recurring job task.
                    Can be "snapshot", "snapshot-force-create", "snapshot-cleanup", "snapshot-delete", "backup", "backup-force-create", "filesystem-trim" or "system-backup".
                  enum:
                    - snapshot
                    - snapshot-force-create
                    - snapshot-cleanup
                    - snapshot-delete
                    - backup
                    - backup-force-create
                    - filesystem-trim
                    - system-backup
                  type: string
              type: object
            status:
              description: RecurringJobStatus defines the observed state of the Longhorn recurring job
              properties:
                executionCount:
                  description: The number of jobs that have been triggered.
                  type: integer
                ownerID:
                  description: The owner ID which is responsible to reconcile this recurring job CR.
                  type: string
              type: object
          type: object
      served: true
      storage: true
      subresources:
        status: {}
