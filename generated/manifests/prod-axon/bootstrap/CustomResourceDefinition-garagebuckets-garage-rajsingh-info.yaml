                      properties:
                        group:
                          description: Group of the referent. Defaults to "" (the core API group).
                          maxLength: 253
                          type: string
                        kind:
                          description: Kind of the referent. Defaults to Service.
                          maxLength: 253
                          type: string
                        name:
                          description: Name of the referent.
                          maxLength: 253
                          minLength: 1
                          type: string
                        namespace:
                          description: |-
