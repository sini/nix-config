apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  labels:
    app.kubernetes.io/instance: longhorn
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: longhorn
    app.kubernetes.io/version: v1.13.0
    helm.sh/chart: longhorn-1.13.0
    longhorn-manager: ""
  name: instancemanagerupgradecontrols.longhorn.io
spec:
  group: longhorn.io
  names:
    kind: InstanceManagerUpgradeControl
    listKind: InstanceManagerUpgradeControlList
    plural: instancemanagerupgradecontrols
    shortNames:
      - lhimuc
    singular: instancemanagerupgradecontrol
  scope: Namespaced
  versions:
    - additionalPrinterColumns:
        - description: Desired instance manager image
          jsonPath: .spec.targetImage
          name: Target Image
          type: string
        - description: Node currently being upgraded
          jsonPath: .status.currentNode
          name: Current Node
          type: string
        - description: Scheduled start time
          jsonPath: .spec.startAt
          name: Start At
          type: string
        - jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
      name: v1beta2
      schema:
        openAPIV3Schema:
          description: |-
            InstanceManagerUpgradeControl is the singleton Longhorn CR that orchestrates
            rolling live upgrades of v2 instance managers across all cluster nodes.
          properties:
            apiVersion:
              description: |-
                APIVersion defines the versioned schema of this representation of an object.
                Servers should convert recognized schemas to the latest internal value, and
                may reject unrecognized values.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
              type: string
            kind:
              description: |-
                Kind is a string value representing the REST resource this object represents.
                Servers may infer this from the endpoint the client submits requests to.
                Cannot be updated.
                In CamelCase.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
              type: string
            metadata:
              type: object
            spec:
              description: |-
                InstanceManagerUpgradeControlSpec defines the desired state of the
                InstanceManagerUpgradeControl singleton.
              properties:
                startAt:
                  description: StartAt is the RFC3339 timestamp at which the upgrade cycle should begin.
                  type: string
                targetImage:
                  description: TargetImage is the desired instance manager image for all nodes.
                  type: string
              type: object
            status:
              description: |-
                InstanceManagerUpgradeControlStatus defines the observed state of the
                InstanceManagerUpgradeControl.
              properties:
                currentNode:
                  description: CurrentNode is the name of the node that is actively being upgraded.
                  type: string
                nodes:
                  additionalProperties:
                    description: NodeUpgradeInfo records the upgrade status for a single node.
                    properties:
                      completedAt:
                        description: CompletedAt is the RFC3339 timestamp when the upgrade finished on this node.
                        type: string
                      errorMsg:
                        description: ErrorMsg records the last error encountered while upgrading this node.
                        type: string
                      imuName:
                        description: IMUName is the name of the InstanceManagerUpgrade CR created for this node.
                        type: string
                      retryCount:
                        description: RetryCount tracks how many times the upgrade has been attempted for this node.
                        type: integer
                      startedAt:
                        description: StartedAt is the RFC3339 timestamp when the upgrade began on this node.
                        type: string
                      state:
                        description: State is the current upgrade state for this node.
                        type: string
                    required:
                      - state
                    type: object
                  description: |-
                    Nodes holds the upgrade status for nodes participating in the current or
                    most recent upgrade cycle.
                  nullable: true
                  type: object
                ownerID:
                  description: OwnerID is the ID of the Longhorn manager pod that currently owns this CR.
                  type: string
              type: object
          type: object
      served: true
      storage: true
      subresources:
        status: {}
