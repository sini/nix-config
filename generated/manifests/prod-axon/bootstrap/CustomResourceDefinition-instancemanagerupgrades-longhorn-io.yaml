apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  labels:
    app.kubernetes.io/instance: longhorn
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: longhorn
    app.kubernetes.io/version: v1.13.0
    helm.sh/chart: longhorn-1.13.0
    longhorn-manager: ""
  name: instancemanagerupgrades.longhorn.io
spec:
  group: longhorn.io
  names:
    kind: InstanceManagerUpgrade
    listKind: InstanceManagerUpgradeList
    plural: instancemanagerupgrades
    shortNames:
      - lhimu
    singular: instancemanagerupgrade
  scope: Namespaced
  versions:
    - additionalPrinterColumns:
        - description: The state of the instance manager upgrade
          jsonPath: .status.state
          name: State
          type: string
        - description: The desired image after upgrade
          jsonPath: .spec.targetImage
          name: Target Image
          type: string
        - jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
      name: v1beta2
      schema:
        openAPIV3Schema:
          description: |-
            InstanceManagerUpgrade is the Longhorn CR that tracks the live upgrade of a
            v2 instance manager.
          properties:
            apiVersion:
              description: |-
                APIVersion defines the versioned schema of this representation of an object.
                Servers should convert recognized schemas to the latest internal value, and
                may reject unrecognized values.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
              type: string
            kind:
              description: |-
                Kind is a string value representing the REST resource this object represents.
                Servers may infer this from the endpoint the client submits requests to.
                Cannot be updated.
                In CamelCase.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
              type: string
            metadata:
              type: object
            spec:
              description: InstanceManagerUpgradeSpec defines the desired state of the InstanceManagerUpgrade.
              properties:
                nodeID:
                  description: NodeID is the node where the source instance manager is running.
                  type: string
                targetImage:
                  description: TargetImage is the desired instance manager image after upgrade.
                  type: string
              required:
                - nodeID
                - targetImage
              type: object
            status:
              description: InstanceManagerUpgradeStatus defines the observed state of the InstanceManagerUpgrade.
              properties:
                abortReason:
                  description: AbortReason explains why AbortRequested was set.
                  type: string
                abortRequested:
                  description: AbortRequested is set by the controller when an abort condition is detected.
                  type: boolean
                conditions:
                  description: Conditions records the current conditions of the upgrade.
                  items:
                    properties:
                      lastProbeTime:
                        description: Last time we probed the condition.
                        type: string
                      lastTransitionTime:
                        description: Last time the condition transitioned from one status to another.
                        type: string
                      message:
                        description: Human-readable message indicating details about last transition.
                        type: string
                      reason:
                        description: Unique, one-word, CamelCase reason for the condition's last transition.
                        type: string
                      status:
                        description: |-
                          Status is the status of the condition.
                          Can be True, False, Unknown.
                        type: string
                      type:
                        description: Type is the type of the condition.
                        type: string
                    type: object
                  nullable: true
                  type: array
                engines:
                  additionalProperties:
                    description: |-
                      EngineRelocation records the relocation metadata of an engine during an
                      instance manager upgrade.
                    properties:
                      originalNodeID:
                        description: OriginalNodeID is the node where the engine was originally running.
                        type: string
                      temporaryNodeID:
                        description: |-
                          TemporaryNodeID is the node the engine is temporarily relocated to while
                          the source instance manager is being upgraded.
                        type: string
                    required:
                      - originalNodeID
                    type: object
                  description: |-
                    Engines records the relocation plan for each engine managed by the source
                    instance manager. The map key is the volume name.
                  nullable: true
                  type: object
                errorMsg:
                  description: ErrorMsg records the terminal error encountered during the upgrade, if any.
                  type: string
                ownerID:
                  description: OwnerID is the owner node ID of this InstanceManagerUpgrade.
                  type: string
                plannedDetachedReplicas:
                  additionalProperties:
                    items:
                      description: |-
                        PlannedDetachedReplica records a backend that should be temporarily detached
                        from an engine during an instance manager upgrade.
                      properties:
                        address:
                          description: |-
                            Address is the raw replica backend address recorded when the detach plan
                            is created.
                          type: string
                        name:
                          description: Name is the replica name.
                          type: string
                      required:
                        - address
                        - name
                      type: object
                    type: array
                  description: |-
                    PlannedDetachedReplicas records the replicas that should be temporarily
                    detached from engines during the instance manager upgrade. The map key is
                    the volume name.
                  nullable: true
                  type: object
                startedAt:
                  description: StartedAt records when the timed or active portion of the upgrade began.
                  type: string
                state:
                  description: State indicates the overall progress of the instance manager upgrade.
                  type: string
              type: object
          type: object
      served: true
      storage: true
      subresources:
        status: {}
