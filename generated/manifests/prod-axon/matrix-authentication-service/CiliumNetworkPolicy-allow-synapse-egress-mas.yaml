apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-synapse-egress-mas
  namespace: matrix
spec:
  description: Allow MAS to provision users through Synapse.
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: synapse
      toPorts:
        - ports:
            - port: "8008"
              protocol: TCP
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: matrix-authentication-service
