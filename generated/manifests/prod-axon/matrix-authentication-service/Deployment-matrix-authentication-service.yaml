apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/controller: main
    app.kubernetes.io/instance: matrix-authentication-service
    app.kubernetes.io/name: matrix-authentication-service
  name: matrix-authentication-service
  namespace: matrix
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/controller: main
      app.kubernetes.io/instance: matrix-authentication-service
      app.kubernetes.io/name: matrix-authentication-service
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: main
        app.kubernetes.io/instance: matrix-authentication-service
        app.kubernetes.io/name: matrix-authentication-service
    spec:
      automountServiceAccountToken: false
      containers:
        - args:
            - server
            - --config
            - /config/config.yaml
            - --config
            - /secrets/secrets.yaml
          image: ghcr.io/element-hq/matrix-authentication-service@sha256:085e37263957b3b79be85de9cfda1980b97e9653f284fba0c902445e06c200b8
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
          name: main
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
          volumeMounts:
            - mountPath: /config
              name: config
            - mountPath: /secrets/oidc-client-secret
              name: oidc
              readOnly: true
              subPath: client-secret
            - mountPath: /secrets/secrets.yaml
              name: secrets
              readOnly: true
              subPath: secrets.yaml
            - mountPath: /secrets/encryption-key
              name: secrets
              readOnly: true
              subPath: encryption-key
            - mountPath: /secrets/signing.key
              name: secrets
              readOnly: true
              subPath: signing.key
            - mountPath: /secrets/shared-secret
              name: secrets
              readOnly: true
              subPath: shared-secret
      dnsPolicy: ClusterFirst
      enableServiceLinks: false
      hostIPC: false
      hostNetwork: false
      hostPID: false
      securityContext:
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
      serviceAccountName: matrix-authentication-service
      volumes:
        - configMap:
            name: matrix-authentication-service-config
          name: config
        - name: oidc
          secret:
            secretName: synapse-oidc-client-secret
        - name: secrets
          secret:
            secretName: matrix-mas
