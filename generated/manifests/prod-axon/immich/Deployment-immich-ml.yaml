apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/controller: ml
    app.kubernetes.io/instance: immich
    app.kubernetes.io/name: immich
  name: immich-ml
  namespace: immich
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/controller: ml
      app.kubernetes.io/instance: immich
      app.kubernetes.io/name: immich
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: ml
        app.kubernetes.io/instance: immich
        app.kubernetes.io/name: immich
    spec:
      automountServiceAccountToken: false
      containers:
        - env:
            - name: MACHINE_LEARNING_CACHE_FOLDER
              value: /cache
            - name: TZ
              value: America/Los_Angeles
          image: ghcr.io/immich-app/immich-machine-learning@sha256:14367bfb374b8576ddf49abd67c5ca0190a4c7fcf6303cdad65d7f7bf1a50bc2
          name: main
          volumeMounts:
            - mountPath: /cache
              name: cache
      dnsPolicy: ClusterFirst
      enableServiceLinks: false
      hostIPC: false
      hostNetwork: false
      hostPID: false
      serviceAccountName: immich
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: immich-ml-cache
