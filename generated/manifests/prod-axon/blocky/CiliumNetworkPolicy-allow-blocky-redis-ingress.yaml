apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-blocky-redis-ingress
  namespace: blocky
spec:
  description: 'blocky-redis: the blocky pods only.'
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: blocky-redis
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: blocky
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
