apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-blocky-egress
  namespace: blocky
spec:
  description: 'Blocky: DoT upstreams, list downloads, quad-100 for tailnet names, and its Valkey (CoreDNS comes from coredns.nix''s grant).'
  egress:
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "853"
              protocol: TCP
            - port: "443"
              protocol: TCP
    - toCIDR:
        - 100.100.100.100/32
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/instance: blocky-redis
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: blocky
