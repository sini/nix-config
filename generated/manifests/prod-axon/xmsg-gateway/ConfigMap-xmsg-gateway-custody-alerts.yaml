apiVersion: v1
data:
  xmsg-gateway-custody.yaml: '{"groups":[{"name":"xmsg-gateway-custody","rules":[{"alert":"XmsgGatewayCustodyDeferred","annotations":{"description":"New messages are not stored or acked: the hubs'' queues for the gateway leaf grow and Artemis gets nothing. Raise events.custody_limits (xmsg-gateway.nix) or clear the cause.","summary":"xmsg gateway custody is deferring intake ({{ $labels.reason }})"},"expr":"sum by (reason) (count_over_time({namespace=\"xmsg-gateway\", container=\"gateway\"} |= \"custody intake deferred\" | regexp `reason=(?P<reason>[a-z_]+)` [5m])) > 0","labels":{"severity":"critical"}},{"alert":"XmsgGatewayCustodyUnavailable","annotations":{"summary":"xmsg gateway custody store is unavailable"},"expr":"sum(count_over_time({namespace=\"xmsg-gateway\", container=\"gateway\"} |~ \"custody (store )?unavailable\" [5m])) > 0","labels":{"severity":"critical"}},{"alert":"XmsgGatewayCustodyNearFull","annotations":{"summary":"xmsg gateway custody active rows at {{ $value | humanizePercentage }} of max_items"},"expr":"max(max_over_time({namespace=\"xmsg-gateway\", container=\"gateway\"} |= \"custody capacity\" | regexp `active_rows=(?P<v>\\d+)` | unwrap v [15m])) / max(max_over_time({namespace=\"xmsg-gateway\", container=\"gateway\"} |= \"custody capacity\" | regexp `max_items=(?P<v>\\d+)` | unwrap v [15m])) >= 0.8","labels":{"severity":"warning"}},{"alert":"XmsgGatewayCustodyRetiredNearFull","annotations":{"summary":"xmsg gateway retired-grant custody rows at {{ $value | humanizePercentage }} of max_retired_items"},"expr":"max(max_over_time({namespace=\"xmsg-gateway\", container=\"gateway\"} |= \"custody capacity\" | regexp `retired_rows=(?P<v>\\d+)` | unwrap v [15m])) / max(max_over_time({namespace=\"xmsg-gateway\", container=\"gateway\"} |= \"custody capacity\" | regexp `max_retired_items=(?P<v>\\d+)` | unwrap v [15m])) >= 0.8","labels":{"severity":"warning"}},{"alert":"XmsgGatewayCustodyCapacityLogMissing","annotations":{"summary":"no xmsg gateway custody capacity line in 20 minutes; the custody alerts are blind"},"expr":"absent_over_time({namespace=\"xmsg-gateway\", container=\"gateway\"} |= \"custody capacity\" [20m])","labels":{"severity":"warning"}}]}]}'
kind: ConfigMap
metadata:
  labels:
    loki_rule: "true"
  name: xmsg-gateway-custody-alerts
  namespace: monitoring
