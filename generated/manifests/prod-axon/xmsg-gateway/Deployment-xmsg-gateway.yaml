apiVersion: apps/v1
kind: Deployment
metadata:
  name: xmsg-gateway
  namespace: xmsg-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: xmsg-gateway
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        json64.dev/config-hash: 2e75e58c386e7f6df1c61272fcb7d643fa618fb132fe84aefa8f3e220127ed9e
      labels:
        app.kubernetes.io/name: xmsg-gateway
    spec:
      automountServiceAccountToken: false
      containers:
        - args:
            - serve
            - --leaf
            - --leaf-principal
            - xmsg-gateway
            - --listen
            - 127.0.0.1:7787
            - --leaf-register-sock
            - /run/user/xmsg/register.sock
            - --agent-sock
            - /run/user/xmsg/agent.sock
            - --db-path
            - /var/lib/xmsg-mcp-gateway/xmsg/xmsg.db
            - --peers-file
            - /etc/xmsg/peers/peers.json
            - --fed-cert
            - /etc/xmsg/tls/tls.crt
            - --fed-key
            - /etc/xmsg/tls/tls.key
            - --idempotency-ttl
            - "86400"
            - --max-body
            - "65536"
            - --reply-ttl
            - "604800"
            - --svc-queue-cap
            - "100"
          env:
            - name: XDG_RUNTIME_DIR
              value: /run/user
          image: ghcr.io/sini/xmsg@sha256:9059226e82340e2fb31326cd1d58acc8e1c2752d277cc5d9056e086b8ae934b9
          name: xmsg
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 10001
            runAsNonRoot: true
            runAsUser: 10001
          volumeMounts:
            - mountPath: /run/user
              name: run
            - mountPath: /tmp
              name: tmp
            - mountPath: /var/lib/xmsg-mcp-gateway
              name: data
            - mountPath: /etc/xmsg/tls
              name: tls
              readOnly: true
            - mountPath: /etc/xmsg/peers
              name: peers
              readOnly: true
        - args:
            - serve
            - --config
            - /etc/xmsg-mcp-gateway/serving.json
          image: ghcr.io/sini/xmsg-mcp-gateway@sha256:ecda43fee2d6319aa41aeda93137cd1442667148e41e794bed08f2509be3e4b5
          name: gateway
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 10001
            runAsNonRoot: true
            runAsUser: 10001
          volumeMounts:
            - mountPath: /run/user
              name: run
            - mountPath: /tmp
              name: tmp
            - mountPath: /var/lib/xmsg-mcp-gateway
              name: data
            - mountPath: /run/xmsg-mcp-gateway
              name: keys
              readOnly: true
            - mountPath: /etc/xmsg-mcp-gateway
              name: config
              readOnly: true
        - args:
            - --mcp.oauth-trusted-origin
            - https://idm.json64.dev
          env:
            - name: CONTROL_PLANE_TUNNEL_ID
              value: tunnel_6af201ecbe0c8191b130364319b328a2
            - name: CONTROL_PLANE_BASE_URL
              value: https://api.openai.com
            - name: MCP_SERVER_URL
              value: http://127.0.0.1:8787/mcp
            - name: MCP_STARTUP_WAIT_TIMEOUT
              value: 60s
            - name: HOME
              value: /tmp
            - name: CONTROL_PLANE_API_KEY
              valueFrom:
                secretKeyRef:
                  key: tunnel-runtime-key
                  name: xmsg-gateway
          image: ghcr.io/openai/tunnel-client@sha256:333005e6f5df2760f1b9f06fe873f5fc629554218f68c91d9cfbfe467d0fb42b
          name: tunnel-client
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 10001
            runAsNonRoot: true
            runAsUser: 10001
          volumeMounts:
            - mountPath: /tmp
              name: tmp
      enableServiceLinks: false
      initContainers:
        - command:
            - /bin/sh
            - -c
            - |
              set -eu
              umask 077
              mkdir -p /var/lib/xmsg-mcp-gateway/state /var/lib/xmsg-mcp-gateway/xmsg /run/xmsg-mcp-gateway/keys
              chmod 0700 /var/lib/xmsg-mcp-gateway/state /var/lib/xmsg-mcp-gateway/xmsg /run/xmsg-mcp-gateway/keys
              rm -rf /var/lib/xmsg-mcp-gateway/staging
              mkdir /var/lib/xmsg-mcp-gateway/staging
              rm -f /run/xmsg-mcp-gateway/keys/lookup-secret /run/xmsg-mcp-gateway/keys/events.key
              cp /run/secrets/xmsg-gateway/lookup-secret /run/xmsg-mcp-gateway/keys/lookup-secret
              chmod 0400 /run/xmsg-mcp-gateway/keys/lookup-secret
              base64 -d /run/secrets/xmsg-gateway/events-key > /run/xmsg-mcp-gateway/keys/events.key
              chmod 0600 /run/xmsg-mcp-gateway/keys/events.key
              [ "$(wc -c < /run/xmsg-mcp-gateway/keys/events.key)" -eq 32 ] || { echo "events key is not 32 bytes" >&2; exit 1; }
          image: library/busybox@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
          name: prepare
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 10001
            runAsNonRoot: true
            runAsUser: 10001
          volumeMounts:
            - mountPath: /var/lib/xmsg-mcp-gateway
              name: data
            - mountPath: /run/xmsg-mcp-gateway
              name: keys
            - mountPath: /run/secrets/xmsg-gateway
              name: secrets
              readOnly: true
        - args:
            - --state
            - /var/lib/xmsg-mcp-gateway/staging/grants.db
            - init
          image: ghcr.io/sini/xmsg-mcp-gateway@sha256:ecda43fee2d6319aa41aeda93137cd1442667148e41e794bed08f2509be3e4b5
          name: store-init
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 10001
            runAsNonRoot: true
            runAsUser: 10001
          volumeMounts:
            - mountPath: /var/lib/xmsg-mcp-gateway
              name: data
            - mountPath: /run/xmsg-mcp-gateway
              name: keys
              readOnly: true
            - mountPath: /etc/xmsg-mcp-gateway
              name: config
              readOnly: true
        - args:
            - --state
            - /var/lib/xmsg-mcp-gateway/staging/grants.db
            - migrate-custody
          image: ghcr.io/sini/xmsg-mcp-gateway@sha256:ecda43fee2d6319aa41aeda93137cd1442667148e41e794bed08f2509be3e4b5
          name: store-migrate-custody
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 10001
            runAsNonRoot: true
            runAsUser: 10001
          volumeMounts:
            - mountPath: /var/lib/xmsg-mcp-gateway
              name: data
            - mountPath: /run/xmsg-mcp-gateway
              name: keys
              readOnly: true
            - mountPath: /etc/xmsg-mcp-gateway
              name: config
              readOnly: true
        - args:
            - --state
            - /var/lib/xmsg-mcp-gateway/staging/grants.db
            - migrate-outbound
          image: ghcr.io/sini/xmsg-mcp-gateway@sha256:ecda43fee2d6319aa41aeda93137cd1442667148e41e794bed08f2509be3e4b5
          name: store-migrate-outbound
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 10001
            runAsNonRoot: true
            runAsUser: 10001
          volumeMounts:
            - mountPath: /var/lib/xmsg-mcp-gateway
              name: data
            - mountPath: /run/xmsg-mcp-gateway
              name: keys
              readOnly: true
            - mountPath: /etc/xmsg-mcp-gateway
              name: config
              readOnly: true
        - command:
            - python3
            - -I
            - -c
            - |
              import os, sqlite3, sys, time
              LEGACY, RETIREMENT, SUMMARY = 0x584d4757, 0x584d4752, 0x584d4753
              os.umask(0o077)
              target = None
              if os.path.exists("/var/lib/xmsg-mcp-gateway/state/grants.db"):
                  src = sqlite3.connect("file:/var/lib/xmsg-mcp-gateway/state/grants.db?mode=rw", uri=True)
                  app = src.execute("PRAGMA application_id").fetchone()[0]
                  if app not in (LEGACY, RETIREMENT, SUMMARY):
                      sys.exit("/var/lib/xmsg-mcp-gateway/state/grants.db: unrecognized application_id " + hex(app))
                  retired = src.execute("SELECT 1 FROM sqlite_master WHERE name = 'outbound_retirement_schema'").fetchone() is not None
                  if app == LEGACY or (app == SUMMARY and not retired):
                      os.makedirs("/var/lib/xmsg-mcp-gateway/backups", mode=0o700, exist_ok=True)
                      out = "/var/lib/xmsg-mcp-gateway/backups/grants.db.pre-retirement-" + time.strftime("%Y%m%dT%H%M%SZ", time.gmtime())
                      dst = sqlite3.connect(out + ".partial")
                      src.backup(dst)
                      ok = dst.execute("PRAGMA application_id").fetchone()[0] == app and dst.execute("PRAGMA quick_check").fetchone()[0] == "ok"
                      dst.close()
                      if not ok:
                          sys.exit(out + ".partial: backup failed verification")
                      os.replace(out + ".partial", out)
                      fd = os.open("/var/lib/xmsg-mcp-gateway/backups", os.O_RDONLY)
                      os.fsync(fd)
                      os.close(fd)
                      print("/var/lib/xmsg-mcp-gateway/state/grants.db: backed up to " + out + ", running retirement")
                      target = "/var/lib/xmsg-mcp-gateway/state/grants.db"
                  else:
                      print("/var/lib/xmsg-mcp-gateway/state/grants.db: retirement already applied, left unchanged")
                  src.close()
              if target is None:
                  target = "/var/lib/xmsg-mcp-gateway/staging/grants.db"
              os.symlink(target, "/var/lib/xmsg-mcp-gateway/staging/retirement.db")
          image: library/python@sha256:20a82dbc2783112ddb91d1534603f802d222a3e63e593cd002eb2ac534e70211
          name: store-retirement-inspect
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 10001
            runAsNonRoot: true
            runAsUser: 10001
          volumeMounts:
            - mountPath: /var/lib/xmsg-mcp-gateway
              name: data
        - args:
            - --state
            - /var/lib/xmsg-mcp-gateway/staging/retirement.db
            - migrate-retirement
          image: ghcr.io/sini/xmsg-mcp-gateway@sha256:ecda43fee2d6319aa41aeda93137cd1442667148e41e794bed08f2509be3e4b5
          name: store-migrate-retirement
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 10001
            runAsNonRoot: true
            runAsUser: 10001
          volumeMounts:
            - mountPath: /var/lib/xmsg-mcp-gateway
              name: data
            - mountPath: /run/xmsg-mcp-gateway
              name: keys
              readOnly: true
            - mountPath: /etc/xmsg-mcp-gateway
              name: config
              readOnly: true
        - command:
            - python3
            - -I
            - -c
            - |
              import os, sqlite3, sys, time
              LEGACY, RETIREMENT, SUMMARY = 0x584d4757, 0x584d4752, 0x584d4753
              os.umask(0o077)
              target = None
              if os.path.exists("/var/lib/xmsg-mcp-gateway/state/grants.db"):
                  src = sqlite3.connect("file:/var/lib/xmsg-mcp-gateway/state/grants.db?mode=rw", uri=True)
                  app = src.execute("PRAGMA application_id").fetchone()[0]
                  if app not in (LEGACY, RETIREMENT, SUMMARY):
                      sys.exit("/var/lib/xmsg-mcp-gateway/state/grants.db: unrecognized application_id " + hex(app))
                  retired = src.execute("SELECT 1 FROM sqlite_master WHERE name = 'outbound_retirement_schema'").fetchone() is not None
                  if app != SUMMARY:
                      os.makedirs("/var/lib/xmsg-mcp-gateway/backups", mode=0o700, exist_ok=True)
                      out = "/var/lib/xmsg-mcp-gateway/backups/grants.db.pre-custody-summaries-" + time.strftime("%Y%m%dT%H%M%SZ", time.gmtime())
                      dst = sqlite3.connect(out + ".partial")
                      src.backup(dst)
                      ok = dst.execute("PRAGMA application_id").fetchone()[0] == app and dst.execute("PRAGMA quick_check").fetchone()[0] == "ok"
                      dst.close()
                      if not ok:
                          sys.exit(out + ".partial: backup failed verification")
                      os.replace(out + ".partial", out)
                      fd = os.open("/var/lib/xmsg-mcp-gateway/backups", os.O_RDONLY)
                      os.fsync(fd)
                      os.close(fd)
                      print("/var/lib/xmsg-mcp-gateway/state/grants.db: backed up to " + out + ", running custody-summaries")
                      target = "/var/lib/xmsg-mcp-gateway/state/grants.db"
                  else:
                      print("/var/lib/xmsg-mcp-gateway/state/grants.db: custody-summaries already applied, left unchanged")
                  src.close()
              if target is None:
                  src = sqlite3.connect("/var/lib/xmsg-mcp-gateway/staging/grants.db")
                  dst = sqlite3.connect("/var/lib/xmsg-mcp-gateway/staging/custody-summaries-scratch.db")
                  src.backup(dst)
                  src.close()
                  dst.executescript("DROP TABLE custody_refusal_summaries; DROP TABLE custody_gap_summary; PRAGMA application_id = %d;" % RETIREMENT)
                  dst.close()
                  target = "/var/lib/xmsg-mcp-gateway/staging/custody-summaries-scratch.db"
              os.symlink(target, "/var/lib/xmsg-mcp-gateway/staging/custody-summaries.db")
          image: library/python@sha256:20a82dbc2783112ddb91d1534603f802d222a3e63e593cd002eb2ac534e70211
          name: store-custody-summaries-inspect
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 10001
            runAsNonRoot: true
            runAsUser: 10001
          volumeMounts:
            - mountPath: /var/lib/xmsg-mcp-gateway
              name: data
        - args:
            - --state
            - /var/lib/xmsg-mcp-gateway/staging/custody-summaries.db
            - migrate-custody-summaries
          image: ghcr.io/sini/xmsg-mcp-gateway@sha256:ecda43fee2d6319aa41aeda93137cd1442667148e41e794bed08f2509be3e4b5
          name: store-migrate-custody-summaries
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 10001
            runAsNonRoot: true
            runAsUser: 10001
          volumeMounts:
            - mountPath: /var/lib/xmsg-mcp-gateway
              name: data
            - mountPath: /run/xmsg-mcp-gateway
              name: keys
              readOnly: true
            - mountPath: /etc/xmsg-mcp-gateway
              name: config
              readOnly: true
        - args:
            - --state
            - /var/lib/xmsg-mcp-gateway/staging/grants.db
            - migrate-events
            - --key-file
            - /run/xmsg-mcp-gateway/keys/events.key
          image: ghcr.io/sini/xmsg-mcp-gateway@sha256:ecda43fee2d6319aa41aeda93137cd1442667148e41e794bed08f2509be3e4b5
          name: store-migrate-events
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 10001
            runAsNonRoot: true
            runAsUser: 10001
          volumeMounts:
            - mountPath: /var/lib/xmsg-mcp-gateway
              name: data
            - mountPath: /run/xmsg-mcp-gateway
              name: keys
              readOnly: true
            - mountPath: /etc/xmsg-mcp-gateway
              name: config
              readOnly: true
        - args:
            - --state
            - /var/lib/xmsg-mcp-gateway/staging/grants.db
            - enroll
            - chatgpt
            - /etc/xmsg-mcp-gateway/binding.json
          image: ghcr.io/sini/xmsg-mcp-gateway@sha256:ecda43fee2d6319aa41aeda93137cd1442667148e41e794bed08f2509be3e4b5
          name: store-enroll
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 10001
            runAsNonRoot: true
            runAsUser: 10001
          volumeMounts:
            - mountPath: /var/lib/xmsg-mcp-gateway
              name: data
            - mountPath: /run/xmsg-mcp-gateway
              name: keys
              readOnly: true
            - mountPath: /etc/xmsg-mcp-gateway
              name: config
              readOnly: true
        - command:
            - /bin/sh
            - -c
            - |
              set -eu
              if [ -e /var/lib/xmsg-mcp-gateway/state/grants.db ]; then
                echo "/var/lib/xmsg-mcp-gateway/state/grants.db present: left unchanged"
              else
                mv /var/lib/xmsg-mcp-gateway/staging/grants.db /var/lib/xmsg-mcp-gateway/state/grants.db
                echo "/var/lib/xmsg-mcp-gateway/state/grants.db created: grant chatgpt enrolled, disabled at revision 1"
              fi
              rm -rf /var/lib/xmsg-mcp-gateway/staging
          image: library/busybox@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
          name: store-install
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 10001
            runAsNonRoot: true
            runAsUser: 10001
          volumeMounts:
            - mountPath: /var/lib/xmsg-mcp-gateway
              name: data
        - args:
            - --state
            - /var/lib/xmsg-mcp-gateway/state/grants.db
            - apply
            - --id
            - chatgpt
            - --policy
            - /etc/xmsg-mcp-gateway/policy.json
          image: ghcr.io/sini/xmsg-mcp-gateway@sha256:ecda43fee2d6319aa41aeda93137cd1442667148e41e794bed08f2509be3e4b5
          name: store-apply
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 10001
            runAsNonRoot: true
            runAsUser: 10001
          volumeMounts:
            - mountPath: /var/lib/xmsg-mcp-gateway
              name: data
            - mountPath: /run/xmsg-mcp-gateway
              name: keys
              readOnly: true
            - mountPath: /etc/xmsg-mcp-gateway
              name: config
              readOnly: true
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: xmsg-gateway
      volumes:
        - emptyDir:
            medium: Memory
          name: run
        - emptyDir:
            medium: Memory
          name: keys
        - emptyDir: {}
          name: tmp
        - name: data
          persistentVolumeClaim:
            claimName: xmsg-gateway
        - name: tls
          secret:
            defaultMode: 288
            secretName: xmsg-gateway-xmsg-tls
        - configMap:
            name: xmsg-gateway-xmsg-peers
          name: peers
        - configMap:
            defaultMode: 292
            name: xmsg-gateway-config
          name: config
        - name: secrets
          secret:
            defaultMode: 288
            items:
              - key: events-key
                path: events-key
              - key: lookup-secret
                path: lookup-secret
            secretName: xmsg-gateway
