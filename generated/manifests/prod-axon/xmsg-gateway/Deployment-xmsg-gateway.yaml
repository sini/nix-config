            - --fed-cert
            - /etc/xmsg/tls/tls.crt
            - --fed-key
            - /etc/xmsg/tls/tls.key
            - --reply-ttl
            - "604800"
            - --idempotency-ttl
            - "86400"
            - --svc-queue-cap
            - "100"
            - --max-body
            - "65536"
