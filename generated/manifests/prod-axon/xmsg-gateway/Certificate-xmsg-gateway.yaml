apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: xmsg-gateway
  namespace: xmsg-gateway
spec:
  duration: 24h
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: xmsg-cluster-ca
  privateKey:
    algorithm: ECDSA
    encoding: PKCS8
    rotationPolicy: Always
    size: 256
  renewBefore: 8h
  secretName: xmsg-gateway-xmsg-tls
  uris:
    - spiffe://json64.dev/ns/xmsg-gateway/sa/xmsg-gateway
  usages:
    - digital signature
    - key encipherment
    - server auth
    - client auth
