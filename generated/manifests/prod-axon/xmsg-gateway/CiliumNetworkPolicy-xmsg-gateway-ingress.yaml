apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: xmsg-gateway-ingress
  namespace: xmsg-gateway
spec:
  description: 'xmsg-gateway: envoy-gateway only, on 8787.'
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: xmsg-gateway
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: gateways
      toPorts:
        - ports:
            - port: "8787"
              protocol: TCP
