apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: xmsg-gateway
  namespace: xmsg-gateway
spec:
  hostnames:
    - xmsg-gateway.json64.dev
  parentRefs:
    - name: default-gateway
      namespace: gateways
      sectionName: json64-dev-https
  rules:
    - backendRefs:
        - name: xmsg-gateway
          port: 8787
      matches:
        - path:
            type: PathPrefix
            value: /.well-known/oauth-protected-resource
        - path:
            type: Exact
            value: /.well-known/oauth-authorization-server
        - path:
            type: PathPrefix
            value: /oauth
