apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    app.kubernetes.io/instance: xmsg-gateway
    app.kubernetes.io/name: xmsg-mcp-gateway
    recurring-job-group.longhorn.io/media-config: enabled
  name: xmsg-gateway
  namespace: xmsg-gateway
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: longhorn
