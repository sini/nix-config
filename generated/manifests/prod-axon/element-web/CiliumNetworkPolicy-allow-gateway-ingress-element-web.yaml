apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-gateway-ingress-element-web
  namespace: matrix
spec:
  description: Allow Envoy Gateway proxies to reach Element Web.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: element-web
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: gateways
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
