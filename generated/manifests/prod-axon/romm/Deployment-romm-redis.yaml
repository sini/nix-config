apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: valkey
    app.kubernetes.io/instance: romm-redis
    app.kubernetes.io/name: valkey
  name: romm-redis
  namespace: media
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: romm-redis
      app.kubernetes.io/name: valkey
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        checksum/initconfig: bee0ed5134b6e64546093f94131f0fd7
      labels:
        app.kubernetes.io/component: valkey
        app.kubernetes.io/instance: romm-redis
        app.kubernetes.io/name: valkey
    spec:
      automountServiceAccountToken: false
      containers:
        - args:
            - /valkey-conf/valkey.conf
          command:
            - valkey-server
          env:
            - name: VALKEY_PROBE_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: redis-password
                  name: media-romm
          image: docker.io/valkey/valkey:9.1.3
          imagePullPolicy: IfNotPresent
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - VALKEYCLI_AUTH="${VALKEY_PROBE_PASSWORD:-${VALKEY_PROBE_PASSWORD_INLINE:-}}"; export VALKEYCLI_AUTH; r=$('valkey-cli' '-p' '6379' 'ping' 2>&1); case "$r" in PONG|LOADING*) exit 0;; esac; echo "$r"; exit 1
            failureThreshold: 3
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 1
          name: valkey
          ports:
            - containerPort: 6379
              name: tcp
              protocol: TCP
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - VALKEYCLI_AUTH="${VALKEY_PROBE_PASSWORD:-${VALKEY_PROBE_PASSWORD_INLINE:-}}"; export VALKEYCLI_AUTH; r=$('valkey-cli' '-p' '6379' 'ping' 2>&1); case "$r" in PONG) exit 0;; esac; echo "$r"; exit 1
            failureThreshold: 3
            initialDelaySeconds: 0
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 1
          resources: {}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - VALKEYCLI_AUTH="${VALKEY_PROBE_PASSWORD:-${VALKEY_PROBE_PASSWORD_INLINE:-}}"; export VALKEYCLI_AUTH; r=$('valkey-cli' '-p' '6379' 'ping' 2>&1); case "$r" in PONG|LOADING*) exit 0;; esac; echo "$r"; exit 1
            failureThreshold: 3
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 1
          volumeMounts:
            - mountPath: /data
              name: valkey-data
            - mountPath: /valkey-conf
              name: valkey-conf
      initContainers:
        - command:
            - /scripts/init.sh
          image: docker.io/valkey/valkey:9.1.3
          imagePullPolicy: IfNotPresent
          name: init
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
          volumeMounts:
            - mountPath: /data
              name: valkey-data
            - mountPath: /valkey-conf
              name: valkey-conf
            - mountPath: /scripts
              name: scripts
            - mountPath: /valkey-users-secret
              name: valkey-users-secret
              readOnly: true
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: romm-redis
      terminationGracePeriodSeconds: 30
      volumes:
        - emptyDir:
            medium: Memory
          name: valkey-conf
        - configMap:
            defaultMode: 365
            name: romm-redis-init-scripts
          name: scripts
        - name: valkey-users-secret
          secret:
            defaultMode: 256
            secretName: media-romm
        - emptyDir: {}
          name: valkey-data
