apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: deny-media-ingress-jellyfin-db-backup
  namespace: media
spec:
  description: Default-deny all ingress to jellyfin-db-backup (no inbound callers).
  enableDefaultDeny:
    ingress: true
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: jellyfin-db-backup
  ingress:
    - fromEntities:
        - host
