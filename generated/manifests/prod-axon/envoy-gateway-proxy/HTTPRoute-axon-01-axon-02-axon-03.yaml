apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: axon-01-axon-02-axon-03
  namespace: gateways
spec:
  hostnames:
    - idm.json64.dev
  parentRefs:
    - name: default-gateway
      sectionName: json64-dev-https
  rules:
    - backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: axon-01-kanidm
          port: 8443
          weight: 1
        - group: gateway.envoyproxy.io
          kind: Backend
          name: axon-02-kanidm
          port: 8443
          weight: 1
        - group: gateway.envoyproxy.io
          kind: Backend
          name: axon-03-kanidm
          port: 8443
          weight: 1
