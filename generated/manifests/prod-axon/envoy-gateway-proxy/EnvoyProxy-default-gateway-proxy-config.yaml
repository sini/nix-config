apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: default-gateway-proxy-config
  namespace: gateways
spec:
  provider:
    kubernetes:
      envoyDeployment:
        pod:
          topologySpreadConstraints:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: envoy
              matchLabelKeys:
                - pod-template-hash
                - gateway.envoyproxy.io/owning-gateway-name
                - gateway.envoyproxy.io/owning-gateway-namespace
              maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: DoNotSchedule
        replicas: 3
        strategy:
          rollingUpdate:
            maxSurge: 1
      envoyService:
        annotations:
          lbipam.cilium.io/ips: 10.11.0.1
        type: LoadBalancer
    type: Kubernetes
  telemetry:
    accessLog:
      settings:
        - format:
            json:
              :authority: '%REQ(:AUTHORITY)%'
              bytes_received: '%BYTES_RECEIVED%'
              bytes_sent: '%BYTES_SENT%'
              connection_termination_details: '%CONNECTION_TERMINATION_DETAILS%'
              downstream_local_address: '%DOWNSTREAM_LOCAL_ADDRESS%'
              downstream_remote_address: '%DOWNSTREAM_REMOTE_ADDRESS%'
              duration: '%DURATION%'
              method: '%REQ(:METHOD)%'
              protocol: '%PROTOCOL%'
              requested_server_name: '%REQUESTED_SERVER_NAME%'
              response_code: '%RESPONSE_CODE%'
              response_code_details: '%RESPONSE_CODE_DETAILS%'
              response_flags: '%RESPONSE_FLAGS%'
              route_name: '%ROUTE_NAME%'
              start_time: '%START_TIME%'
              upstream_cluster: '%UPSTREAM_CLUSTER%'
              upstream_host: '%UPSTREAM_HOST%'
              upstream_local_address: '%UPSTREAM_LOCAL_ADDRESS%'
              upstream_transport_failure_reason: '%UPSTREAM_TRANSPORT_FAILURE_REASON%'
              user-agent: '%REQ(USER-AGENT)%'
              x-envoy-origin-path: '%REQ(X-ENVOY-ORIGINAL-PATH?:PATH)%'
              x-envoy-upstream-service-time: '%RESP(X-ENVOY-UPSTREAM-SERVICE-TIME)%'
              x-forwarded-for: '%REQ(X-FORWARDED-FOR)%'
              x-request-id: '%REQ(X-REQUEST-ID)%'
            type: JSON
          matches:
            - '!request.path.startsWith(''/oauth'')'
          sinks:
            - file:
                path: /dev/stdout
              type: File
        - format:
            json:
              :authority: '%REQ(:AUTHORITY)%'
              bytes_received: '%BYTES_RECEIVED%'
              bytes_sent: '%BYTES_SENT%'
              connection_termination_details: '%CONNECTION_TERMINATION_DETAILS%'
              downstream_local_address: '%DOWNSTREAM_LOCAL_ADDRESS%'
              downstream_remote_address: '%DOWNSTREAM_REMOTE_ADDRESS%'
              duration: '%DURATION%'
              method: '%REQ(:METHOD)%'
              protocol: '%PROTOCOL%'
              requested_server_name: '%REQUESTED_SERVER_NAME%'
              response_code: '%RESPONSE_CODE%'
              response_code_details: '%RESPONSE_CODE_DETAILS%'
              response_flags: '%RESPONSE_FLAGS%'
              route_name: '%ROUTE_NAME%'
              start_time: '%START_TIME%'
              upstream_cluster: '%UPSTREAM_CLUSTER%'
              upstream_host: '%UPSTREAM_HOST%'
              upstream_local_address: '%UPSTREAM_LOCAL_ADDRESS%'
              upstream_transport_failure_reason: '%UPSTREAM_TRANSPORT_FAILURE_REASON%'
              user-agent: '%REQ(USER-AGENT)%'
              x-envoy-origin-path: '%REQ_WITHOUT_QUERY(X-ENVOY-ORIGINAL-PATH?:PATH)%'
              x-envoy-upstream-service-time: '%RESP(X-ENVOY-UPSTREAM-SERVICE-TIME)%'
              x-forwarded-for: '%REQ(X-FORWARDED-FOR)%'
              x-request-id: '%REQ(X-REQUEST-ID)%'
            type: JSON
          matches:
            - request.path.startsWith('/oauth')
          sinks:
            - file:
                path: /dev/stdout
              type: File
