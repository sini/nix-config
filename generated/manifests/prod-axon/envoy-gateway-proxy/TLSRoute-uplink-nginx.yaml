apiVersion: gateway.networking.k8s.io/v1
kind: TLSRoute
metadata:
  name: uplink-nginx
  namespace: gateways
spec:
  hostnames:
    - jellyfin.json64.dev
    - homepage.json64.dev
    - oauth2-proxy.json64.dev
    - open-webui.json64.dev
    - den.json64.dev
    - gen-status.json64.dev
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: default-gateway
  rules:
    - backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: uplink-nginx
          port: 8444
          weight: 1
