apiVersion: gateway.networking.k8s.io/v1
kind: TLSRoute
metadata:
  name: axon-01-uplink
  namespace: gateways
spec:
  hostnames:
    - idm.json64.dev
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: default-gateway
  rules:
    - backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: axon-01-kanidm
          port: 8443
          weight: 1
        - group: gateway.envoyproxy.io
          kind: Backend
          name: uplink-nginx
          port: 8444
          weight: 1
