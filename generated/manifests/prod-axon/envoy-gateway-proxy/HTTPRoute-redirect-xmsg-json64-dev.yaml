apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: redirect-xmsg-json64-dev
  namespace: gateways
spec:
  hostnames:
    - xmsg.json64.dev
  parentRefs:
    - name: default-gateway
      namespace: gateways
      sectionName: json64-dev-https
  rules:
    - filters:
        - requestRedirect:
            hostname: xmsg.dev
            scheme: https
            statusCode: 301
          type: RequestRedirect
      name: redirect
