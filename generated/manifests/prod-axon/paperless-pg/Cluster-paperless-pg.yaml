apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: paperless-pg
  namespace: paperless
spec:
  affinity:
    podAntiAffinityType: required
  backup:
    volumeSnapshot:
      className: longhorn-backup-nfs
  bootstrap:
    initdb:
      database: paperless
      owner: paperless
      secret:
        name: paperless-pg-paperless-password
  inheritedMetadata:
    labels:
      recurring-job-group.longhorn.io/db-local-snap: enabled
  instances: 2
  storage:
    size: 10Gi
    storageClass: longhorn-single
