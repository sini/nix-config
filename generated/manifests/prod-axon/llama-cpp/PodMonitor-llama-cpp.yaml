apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: llama-cpp
  namespace: ai
spec:
  podMetricsEndpoints:
    - interval: 30s
      path: /metrics
      port: http
      relabelings:
        - sourceLabels:
            - __meta_kubernetes_pod_label_app_kubernetes_io_name
          targetLabel: instance
  selector:
    matchLabels:
      den.ai/engine: llama-cpp
