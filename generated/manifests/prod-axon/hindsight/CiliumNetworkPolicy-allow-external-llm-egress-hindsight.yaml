apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-external-llm-egress-hindsight
  namespace: ai
spec:
  description: Allow hindsight to reach off-cluster LLM endpoints (e.g. ninfer on cortex-cuda).
  egress:
    - toCIDR:
        - 10.9.2.2/32
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: hindsight
