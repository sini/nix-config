apiVersion: batch/v1
kind: CronJob
metadata:
  name: cnpg-prune-backups
  namespace: cnpg-system
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: cnpg-prune-backups
        spec:
          containers:
            - command:
                - python3
                - /script/prune-backups.py
              env:
                - name: KEEP
                  value: "7"
              image: library/python@sha256:0f9552bb28711333da16915ec146f5e6bb44a7fdac9ced15dc17c2e0206346dd
              name: cnpg-prune-backups
              volumeMounts:
                - mountPath: /script
                  name: script
                  readOnly: true
          restartPolicy: OnFailure
          securityContext:
            runAsGroup: 65534
            runAsNonRoot: true
            runAsUser: 65534
          serviceAccountName: cnpg-prune-backups
          volumes:
            - configMap:
                name: cnpg-prune-backups-script
              name: script
      ttlSecondsAfterFinished: 604800
  schedule: 0 6 * * *
  successfulJobsHistoryLimit: 1
