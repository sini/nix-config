apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: smtp-relay
  namespace: argocd
spec:
  destination:
    namespace: mail
    server: https://kubernetes.default.svc
  project: default
  source:
    path: ./generated/manifests/prod-axon/smtp-relay
    repoURL: https://github.com/sini/nix-config.git
    targetRevision: main
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
