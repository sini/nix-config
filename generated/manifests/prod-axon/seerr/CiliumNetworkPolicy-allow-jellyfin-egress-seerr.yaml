apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-jellyfin-egress-seerr
  namespace: media
spec:
  description: Allow seerr to reach jellyfin's API.
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: jellyfin
      toPorts:
        - ports:
            - port: "8096"
              protocol: TCP
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: seerr
