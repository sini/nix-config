apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
  name: seerr-bootstrap
  namespace: media
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seerr-bootstrap
    spec:
      automountServiceAccountToken: true
      containers:
        - command:
            - python3
            - /config/bootstrap.py
          image: library/python@sha256:0f9552bb28711333da16915ec146f5e6bb44a7fdac9ced15dc17c2e0206346dd
          name: bootstrap
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /config
              name: config
              readOnly: true
            - mountPath: /secrets
              name: secrets
              readOnly: true
      enableServiceLinks: false
      restartPolicy: OnFailure
      securityContext:
        fsGroup: 65534
        runAsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: seerr-bootstrap
      volumes:
        - configMap:
            name: seerr-bootstrap
          name: config
        - name: secrets
          projected:
            defaultMode: 288
            sources:
              - secret:
                  items:
                    - key: seerr
                      path: api-key
                    - key: sonarr
                      path: sonarr
                    - key: radarr
                      path: radarr
                  name: media-arr-api-keys
              - secret:
                  items:
                    - key: admin-password
                      path: admin-password
                  name: jellyfin-secrets
