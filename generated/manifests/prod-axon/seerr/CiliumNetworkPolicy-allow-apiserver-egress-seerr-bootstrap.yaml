apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-apiserver-egress-seerr-bootstrap
  namespace: media
spec:
  description: Allow seerr-bootstrap to restart the seerr Deployment through the kube-apiserver.
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: seerr-bootstrap
