apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-mas-egress-synapse
  namespace: matrix
spec:
  description: Allow synapse to introspect tokens at MAS.
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: matrix-authentication-service
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: synapse
