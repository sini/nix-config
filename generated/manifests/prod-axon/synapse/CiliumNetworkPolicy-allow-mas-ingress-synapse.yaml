apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-mas-ingress-synapse
  namespace: matrix
spec:
  description: Allow MAS to provision users through Synapse.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: synapse
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: matrix-authentication-service
      toPorts:
        - ports:
            - port: "8008"
              protocol: TCP
