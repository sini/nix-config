apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: site-getqvr-com-www
  namespace: garage
spec:
  hostnames:
    - www.getqvr.com
  parentRefs:
    - name: default-gateway
      namespace: gateways
      sectionName: getqvr-com-https
  rules:
    - filters:
        - requestRedirect:
            hostname: getqvr.com
            scheme: https
            statusCode: 301
          type: RequestRedirect
      name: to-apex
