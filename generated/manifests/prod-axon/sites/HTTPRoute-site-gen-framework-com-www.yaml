apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: site-gen-framework-com-www
  namespace: garage
spec:
  hostnames:
    - www.gen-framework.com
  parentRefs:
    - name: default-gateway
      namespace: gateways
      sectionName: gen-framework-com-https
  rules:
    - filters:
        - requestRedirect:
            hostname: gen-framework.com
            scheme: https
            statusCode: 301
          type: RequestRedirect
      name: to-apex
