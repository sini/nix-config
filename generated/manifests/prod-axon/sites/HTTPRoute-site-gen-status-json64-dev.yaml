apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: site-gen-status-json64-dev
  namespace: garage
spec:
  hostnames:
    - gen-status.json64.dev
  parentRefs:
    - name: default-gateway
      namespace: gateways
      sectionName: json64-dev-https
  rules:
    - backendRefs:
        - name: garage
          port: 3902
      filters:
        - responseHeaderModifier:
            set:
              - name: Cache-Control
                value: public, max-age=60, must-revalidate
          type: ResponseHeaderModifier
      matches:
        - path:
            type: PathPrefix
            value: /data/
      name: headers-1
    - backendRefs:
        - name: garage
          port: 3902
      name: site
