apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: homepage-to-dash
  namespace: garage
spec:
  hostnames:
    - homepage.json64.dev
  parentRefs:
    - name: default-gateway
      namespace: gateways
      sectionName: json64-dev-https
  rules:
    - filters:
        - requestRedirect:
            hostname: dash.json64.dev
            scheme: https
            statusCode: 301
          type: RequestRedirect
      name: to-dash
