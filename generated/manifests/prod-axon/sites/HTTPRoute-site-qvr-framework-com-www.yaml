apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: site-qvr-framework-com-www
  namespace: garage
spec:
  hostnames:
    - www.qvr-framework.com
  parentRefs:
    - name: default-gateway
      namespace: gateways
      sectionName: qvr-framework-com-https
  rules:
    - filters:
        - requestRedirect:
            hostname: qvr-framework.com
            scheme: https
            statusCode: 301
          type: RequestRedirect
      name: to-apex
