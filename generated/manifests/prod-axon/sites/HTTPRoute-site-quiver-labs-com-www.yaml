apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: site-quiver-labs-com-www
  namespace: garage
spec:
  hostnames:
    - www.quiver-labs.com
  parentRefs:
    - name: default-gateway
      namespace: gateways
      sectionName: quiver-labs-com-https
  rules:
    - filters:
        - requestRedirect:
            hostname: quiver-labs.com
            scheme: https
            statusCode: 301
          type: RequestRedirect
      name: to-apex
