apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: site-qvr-sh
  namespace: garage
spec:
  hostnames:
    - qvr.sh
  parentRefs:
    - name: default-gateway
      namespace: gateways
      sectionName: qvr-sh-apex-https
  rules:
    - backendRefs:
        - name: garage
          port: 3902
      name: site
