apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: site-qvr-run
  namespace: garage
spec:
  hostnames:
    - qvr.run
  parentRefs:
    - name: default-gateway
      namespace: gateways
      sectionName: qvr-run-apex-https
  rules:
    - backendRefs:
        - name: garage
          port: 3902
      name: site
