apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: site-qvrlab-com
  namespace: garage
spec:
  hostnames:
    - qvrlab.com
  parentRefs:
    - name: default-gateway
      namespace: gateways
      sectionName: qvrlab-com-apex-https
  rules:
    - backendRefs:
        - name: garage
          port: 3902
      name: site
