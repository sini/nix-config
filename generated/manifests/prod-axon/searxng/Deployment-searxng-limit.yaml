apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/controller: main
    app.kubernetes.io/instance: searxng-limit
    app.kubernetes.io/name: searxng-limit
  name: searxng-limit
  namespace: search
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/controller: main
      app.kubernetes.io/instance: searxng-limit
      app.kubernetes.io/name: searxng-limit
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        checksum/configMaps: a9ea20ba1116c692b3a61d298ae1313b99d175bfa8f1ff3a4adc091c6cbe9ac1
      labels:
        app.kubernetes.io/controller: main
        app.kubernetes.io/instance: searxng-limit
        app.kubernetes.io/name: searxng-limit
    spec:
      automountServiceAccountToken: false
      containers:
        - image: library/nginx@sha256:583b7f2fce1cdb8da5ad5c39ebd3c33b98b87d493190e548bdee1fa8c619c311
          livenessProbe:
            tcpSocket:
              port: 8080
          name: main
          readinessProbe:
            tcpSocket:
              port: 8080
          volumeMounts:
            - mountPath: /var/cache/nginx
              name: cache
            - mountPath: /etc/nginx/conf.d/default.conf
              name: config
              readOnly: true
              subPath: default.conf
      dnsPolicy: ClusterFirst
      enableServiceLinks: false
      hostIPC: false
      hostNetwork: false
      hostPID: false
      serviceAccountName: searxng-limit
      volumes:
        - emptyDir: {}
          name: cache
        - configMap:
            name: searxng-limit
          name: config
