apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: searxng-ingress
  namespace: search
spec:
  description: 'searxng: its pacer (searxng-limit) only, on 8080.'
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: searxng
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: searxng-limit
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
