apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  annotations:
    cert-manager.io/issue-temporary-certificate: "true"
  name: gen-wtf-wildcard-certificate
  namespace: certs
spec:
  dnsNames:
    - gen.wtf
    - "*.gen.wtf"
  issuerRef:
    kind: ClusterIssuer
    name: global-issuer
  secretName: gen-wtf-wildcard-tls
