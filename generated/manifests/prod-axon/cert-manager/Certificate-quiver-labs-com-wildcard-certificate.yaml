apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  annotations:
    cert-manager.io/issue-temporary-certificate: "true"
  name: quiver-labs-com-wildcard-certificate
  namespace: certs
spec:
  dnsNames:
    - quiver-labs.com
    - '*.quiver-labs.com'
  issuerRef:
    kind: ClusterIssuer
    name: global-issuer
  secretName: quiver-labs-com-wildcard-tls
