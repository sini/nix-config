apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  annotations:
    cert-manager.io/issue-temporary-certificate: "true"
  name: xmsg-net-wildcard-certificate
  namespace: certs
spec:
  dnsNames:
    - xmsg.net
    - '*.xmsg.net'
  issuerRef:
    kind: ClusterIssuer
    name: global-issuer
  secretName: xmsg-net-wildcard-tls
