apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: attic-pg-metrics
  namespace: attic
spec:
  podMetricsEndpoints:
    - port: metrics
      relabelings:
        - sourceLabels:
            - __meta_kubernetes_pod_name
          targetLabel: instance
  selector:
    matchLabels:
      cnpg.io/cluster: attic-pg
      cnpg.io/podRole: instance
