apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: attic
  namespace: attic
spec:
  hostnames:
    - attic.json64.dev
  parentRefs:
    - name: default-gateway
      namespace: gateways
      sectionName: json64-dev-https
  rules:
    - backendRefs:
        - name: attic
          port: 8080
