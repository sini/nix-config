apiVersion: v1
data:
  server.toml: |
    allowed-hosts = ["attic.json64.dev"]
    api-endpoint = "https://attic.json64.dev/"
    listen = "[::]:8080"

    [chunking]
    avg-size = 1048576
    max-size = 4194304
    min-size = 262144
    nar-size-threshold = 1048576

    [compression]
    type = "zstd"

    [database]

    [garbage-collection]
    default-retention-period = "90 days"
    interval = "12 hours"

    [storage]
    bucket = "attic"
    endpoint = "https://s3.json64.dev"
    region = "garage"
    type = "s3"
kind: ConfigMap
metadata:
  name: attic-config
  namespace: attic
