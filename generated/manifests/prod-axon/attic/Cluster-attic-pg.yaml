apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: attic-pg
  namespace: attic
spec:
  affinity:
    podAntiAffinityType: required
  backup:
    volumeSnapshot:
      className: longhorn-backup-nfs
  inheritedMetadata:
    labels:
      recurring-job-group.longhorn.io/db-local-snap: enabled
  instances: 2
  managed:
    roles:
      - login: true
        name: attic
        passwordSecret:
          name: attic-pg-attic-password
  postgresql:
    synchronous:
      dataDurability: preferred
      method: any
      number: 1
  storage:
    size: 5Gi
    storageClass: longhorn-single
