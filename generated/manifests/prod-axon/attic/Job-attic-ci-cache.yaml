apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
  name: attic-ci-cache
  namespace: attic
spec:
  backoffLimit: 6
  template:
    spec:
      automountServiceAccountToken: false
      containers:
        - command:
            - /bin/sh
            - -c
            - |
              set -eu
              url="http://attic.attic.svc:8080/_api/v1/cache-config/ci"
              auth="Authorization: Bearer $(cat /secrets/ci-admin-token)"
              host="Host: attic.json64.dev"
              if wget -q -O /dev/null --header "$auth" --header "$host" "$url"; then
                echo "cache ci exists: left unchanged"
                exit 0
              fi
              kp=$(cat /secrets/ci-keypair)
              body=$(printf '{"keypair":{"Keypair":"%s"},"is_public":true,"store_dir":"/nix/store","priority":41,"upstream_cache_key_names":["cache.nixos.org-1"]}' "$kp")
              wget -q -O - --header "$auth" --header "$host" \
                --header "Content-Type: application/json" --post-data "$body" "$url"
              echo "cache ci created with the stored keypair"
          image: library/busybox@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
          name: create
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 65532
            runAsNonRoot: true
            runAsUser: 65532
          volumeMounts:
            - mountPath: /secrets
              name: keypair
              readOnly: true
      restartPolicy: OnFailure
      securityContext:
        fsGroup: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: keypair
          secret:
            defaultMode: 288
            items:
              - key: ci-keypair
                path: ci-keypair
              - key: ci-admin-token
                path: ci-admin-token
            secretName: attic-secrets
