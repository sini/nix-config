name: Formatting Check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  treefmt:
    name: treefmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            experimental-features = nix-command flakes
      # The flake's formatter is the treefmt wrapper the pre-commit hook runs (same store
      # path, same config), over the whole tree rather than the staged files.
      - run: nix fmt -- --fail-on-change --no-cache
